<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VATSIM Gate Management — Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0b0f14; --panel:#121820; --panel2:#161d27; --accent:#3fa9f5; --accent2:#f5a83f;
    --green:#3fd68a; --red:#f5546c; --text:#e8edf2; --muted:#8b98a5; --border:#232c37;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:linear-gradient(90deg,#0d1420,#131a26);padding:14px 20px;border-bottom:2px solid var(--accent);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  header h1{margin:0;font-size:18px;letter-spacing:1px;}
  header h1 span{color:var(--accent);}
  .countdown{font-size:12px;color:var(--muted);padding:6px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;}
  .countdown b{color:var(--accent);}
  #map{position:absolute;top:56px;left:0;right:0;bottom:0;}
  .legend{position:absolute;bottom:20px;left:20px;background:rgba(18,24,32,0.92);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12px;z-index:1000;color:var(--text);}
  .legend .row{display:flex;align-items:center;gap:6px;margin:3px 0;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .dot.green{background:var(--green);}
  .dot.red{background:var(--red);}
  .dot.orange{background:var(--accent2);}
  .status-bar{position:absolute;top:66px;right:16px;background:rgba(18,24,32,0.92);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--muted);z-index:1000;max-width:300px;}
  .hint{position:absolute;top:66px;left:16px;background:rgba(18,24,32,0.92);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--muted);z-index:1000;max-width:260px;}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .leaflet-popup-content-wrapper{background:#161d27;color:#e8edf2;border-radius:8px;}
  .leaflet-popup-tip{background:#161d27;}
  .popup-title{font-weight:bold;color:#3fa9f5;font-size:14px;margin-bottom:4px;}
  .popup-row{font-size:12px;color:#8b98a5;margin:2px 0;}
  .popup-row b{color:#e8edf2;}
</style>
</head>
<body>

<header>
  <h1>VATSIM <span>Gate Map</span></h1>
  <div class="countdown" id="countdown">Pan/zoom to an airport to load gates</div>
</header>

<div id="map"></div>

<div class="hint" id="hintBox">Zoom in on any airport (zoom level 12+) — gate positions load once, then only live VATSIM occupancy refreshes every 15s.</div>

<div class="legend">
  <div class="row"><span class="dot green"></span> Available</div>
  <div class="row"><span class="dot red"></span> Occupied</div>
  <div class="row"><span class="dot orange"></span> Unverified (low confidence)</div>
</div>

<div class="status-bar" id="statusBar">Zoom in on an airport to begin.</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const MIN_ZOOM_FOR_GATES = 12;
const REFRESH_INTERVAL_S = 15;
const GATEMAP_RETRY_DELAY_MS = 4000;

let map = L.map('map', { zoomControl: true }).setView([50.0333, 8.5706], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

let markers = new Map();
let refreshTimer = null;
let countdownTimer = null;
let secondsLeft = REFRESH_INTERVAL_S;
let moveDebounce = null;

const gateMapCache = new Map();
let currentGates = null;
let currentCenter = null;
let gatemapRetryTimer = null;

function cacheKey(lat, lon){
  return `${Math.round(lat*200)/200},${Math.round(lon*200)/200}`;
}

function colorFor(status){
  if(status === 'occupied') return '#f5546c';
  if(status === 'unverified') return '#f5a83f';
  return '#3fd68a';
}

function resetCountdown(){
  secondsLeft = REFRESH_INTERVAL_S;
  document.getElementById('countdown').innerHTML = `Auto-refresh in <b>${secondsLeft}</b>s`;
}

function startCountdown(){
  if(countdownTimer) clearInterval(countdownTimer);
  resetCountdown();
  countdownTimer = setInterval(() => {
    secondsLeft -= 1;
    if(secondsLeft <= 0){
      document.getElementById('countdown').innerHTML = `<span class="spinner"></span>Refreshing occupancy...`;
    } else {
      document.getElementById('countdown').innerHTML = `Auto-refresh in <b>${secondsLeft}</b>s`;
    }
  }, 1000);
}

function scheduleAutoRefresh(){
  if(refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refreshOccupancy, REFRESH_INTERVAL_S * 1000);
  startCountdown();
}

function renderGateBase(gates){
  markers.forEach(m => map.removeLayer(m));
  markers.clear();
  gates.forEach(g => {
    const marker = L.circleMarker([g.lat, g.lon], {
      radius: 4,
      color: '#3fd68a',
      fillColor: '#3fd68a',
      fillOpacity: 0.85,
      weight: 1.5
    }).addTo(map);
    marker.bindPopup(`<div class="popup-title">Gate ${g.code}</div><div class="popup-row">Loading status...</div>`);
    markers.set(g.code, marker);
  });
}

function applyOccupancy(gates){
  let occCount = 0, unvCount = 0;
  gates.forEach(g => {
    if(g.status === 'occupied') occCount++;
    if(g.status === 'unverified') unvCount++;
    const marker = markers.get(g.gate);
    if(!marker) return;
    marker.setStyle({
      radius: g.status === 'available' ? 4 : 7,
      color: colorFor(g.status),
      fillColor: colorFor(g.status)
    });
    const popupHtml = `
      <div class="popup-title">Gate ${g.gate}</div>
      <div class="popup-row">Status: <b>${g.status}</b></div>
      ${g.confidence ? `<div class="popup-row">Confidence: <b>${g.confidence}</b></div>` : ''}
      ${g.callsign ? `<div class="popup-row">Flight: <b>${g.callsign}</b></div>` : ''}
      ${g.aircraft ? `<div class="popup-row">Aircraft: <b>${g.aircraft}</b></div>` : ''}
    `;
    marker.setPopupContent(popupHtml);
  });
  return { occCount, unvCount };
}

async function refreshOccupancy(){
  if(!currentGates || currentGates.length === 0 || !currentCenter){ scheduleAutoRefresh(); return; }
  const status = document.getElementById('statusBar');
  try{
    const res = await fetch('/api/occupancy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat: currentCenter.lat, lon: currentCenter.lon, gates: currentGates })
    });
    const data = await res.json();
    if(data.error){
      status.textContent = 'Occupancy check error: ' + data.error + ' (will retry)';
      scheduleAutoRefresh();
      return;
    }
    const { occCount, unvCount } = applyOccupancy(data.gates);
    status.innerHTML = `Loaded <b>${data.gateCount}</b> gates — ` +
      `<span style="color:#f5546c;">${occCount} occupied</span>, ` +
      `<span style="color:#f5a83f;">${unvCount} unverified</span>, ` +
      `${data.gateCount - occCount - unvCount} available. Polled at ${new Date(data.polledAt).toLocaleTimeString()}.`;
  } catch(err){
    status.textContent = 'Occupancy refresh failed: ' + err.message + ' (will retry)';
  }
  scheduleAutoRefresh();
}

async function loadGateMapAndStart(lat, lon){
  const status = document.getElementById('statusBar');
  const key = cacheKey(lat, lon);
  currentCenter = { lat, lon };
  if(gatemapRetryTimer) clearTimeout(gatemapRetryTimer);

  if(gateMapCache.has(key)){
    currentGates = gateMapCache.get(key);
    renderGateBase(currentGates);
    status.innerHTML = '<span class="spinner"></span> Gate map cached — checking live occupancy...';
    refreshOccupancy();
    return;
  }

  status.innerHTML = '<span class="spinner"></span> Loading gate map for this area (one-time, cached after)...';
  try{
    const res = await fetch(`/api/gatemap?lat=${lat}&lon=${lon}`);
    if(!res.ok){
      throw new Error(`Server returned ${res.status}`);
    }
    const data = await res.json();
    if(data.error){
      status.innerHTML = `Gate map error: ${data.error} — <span class="spinner"></span>retrying in 4s...`;
      gatemapRetryTimer = setTimeout(() => loadGateMapAndStart(lat, lon), GATEMAP_RETRY_DELAY_MS);
      return;
    }
    if(data.gateCount === 0){
      status.textContent = 'No labeled gates found in OSM near this location.';
      currentGates = [];
      return;
    }
    currentGates = data.gates;
    gateMapCache.set(key, currentGates);
    renderGateBase(currentGates);
    status.innerHTML = `Gate map loaded (<b>${data.gateCount}</b> gates) — checking live occupancy...`;
    refreshOccupancy();
  } catch(err){
    status.innerHTML = `Gate map request failed: ${err.message} — <span class="spinner"></span>retrying in 4s...`;
    gatemapRetryTimer = setTimeout(() => loadGateMapAndStart(lat, lon), GATEMAP_RETRY_DELAY_MS);
  }
}

function onMapSettled(){
  const zoom = map.getZoom();
  const status = document.getElementById('statusBar');
  const hint = document.getElementById('hintBox');

  if(zoom < MIN_ZOOM_FOR_GATES){
    status.textContent = `Zoom in further to load gates (current zoom ${zoom}, need ${MIN_ZOOM_FOR_GATES}+).`;
    hint.style.display = 'block';
    if(refreshTimer) clearTimeout(refreshTimer);
    if(countdownTimer) clearInterval(countdownTimer);
    if(gatemapRetryTimer) clearTimeout(gatemapRetryTimer);
    document.getElementById('countdown').textContent = 'Zoom in to load gates';
    return;
  }
  hint.style.display = 'none';
  const center = map.getCenter();
  loadGateMapAndStart(center.lat.toFixed(5), center.lng.toFixed(5));
}

map.on('moveend zoomend', () => {
  if(moveDebounce) clearTimeout(moveDebounce);
  moveDebounce = setTimeout(onMapSettled, 900);
});

onMapSettled();
</script>

</body>
</html>
